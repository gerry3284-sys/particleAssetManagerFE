<div class="login-page">
  <div class="login-card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-mark">PA</div>
      <div>
        <h2>Particle Asset Manager</h2>
        <p>Accedi per continuare alla gestione degli asset.</p>
      </div>
    </div>

    <!-- Divisore -->
    <div class="divider"></div>

    <!-- Login Microsoft -->
    <div class="microsoft-section">
      <p class="microsoft-hint">Usa il tuo account aziendale Microsoft per accedere.</p>
      <button class="microsoft-btn" (click)="onLogin()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 21 21">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
          <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        Accedi con Microsoft
      </button>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <span>Serve aiuto?</span>
      <a class="link" href="javascript:void(0)">Contatta l'amministratore</a>
    </div>

  </div>
</div>
