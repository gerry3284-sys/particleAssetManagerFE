<div class="sidebar">
  
  <!-- Header utente -->
  <div class="user-header">
    <div class="avatar">
      <img src="/assets/logo_Utente.png" alt="Avatar">
    </div>
    <div class="user-info">
      <div class="user-name">Mario Rossi</div>
      <div class="user-role">Amministrazione</div>
    </div>
  </div>

  <!-- Menu di navigazione -->
  <nav class="sidebar-content">
    <a routerLink="/assets" 
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: false}"
       class="menu-item">
      <span class="icon">
        <!-- logo lista assets  -->
       <img src="/assets/list.png" alt="Avatar">
      </span>
      <span class="label">Lista Asset</span>
    </a>

    <a routerLink="/users" 
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: false}"
       class="menu-item">
      <span class="icon">
        <!-- logo lista utenti  -->
        <img src="/assets/logo_Utente.png" alt="Utenti" width="20" height="20">
      </span>
      <span class="label">Utenti</span>
    </a>

    <a routerLink="/asset-types" 
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: false}"
       class="menu-item">
      <span class="icon">
        <!-- logo lista tipi di assets  -->
        <img src="/assets/list.png" alt="Avatar">
      </span>
      <span class="label">Tipi di Asset</span>
    </a>

    <a routerLink="/businessUnits"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: false}"
       class="menu-item">
      <span class="icon">
        <!-- logo lista tipi di assets  -->
        <img src="/assets/icona-business-unit.png" alt="Avatar">
      </span>
      <span class="label">Business Unit</span>
    </a>

    <a routerLink="/maintenance-assets"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: true}"
       class="menu-item">
      <span class="icon">
        <img src="/assets/list.png" alt="Asset in Manutenzione">
      </span>
      <span class="label">Asset in Manutenzione</span>
      @if (newMaintenanceAssetsCount() > 0) {
        <span class="notification-badge">{{ newMaintenanceAssetsCount() }}</span>
      }
    </a>

    <a routerLink="/tickets"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: false}"
       class="menu-item">
      <span class="icon">
        <!-- logo lista tipi di assets  -->
        <img src="/assets/icona-business-unit.png" alt="Avatar">
      </span>
      <span class="label">Lista Ticket</span>
    </a>
  </nav>

  <!-- Logout -->
  <div class="sidebar-footer">
    <app-button
      class="sidebar-theme-toggle"
      variant="sidebar"
      type="button"
      [fullWidth]="true"
      (pressed)="onToggleTheme()">
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          @if (isDarkTheme()) {
            <path d="M12 3V5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4.93 4.93L6.34 6.34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M17.66 17.66L19.07 19.07" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M3 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M19 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4.93 19.07L6.34 17.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M17.66 6.34L19.07 4.93" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
          } @else {
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          }
        </svg>
      </span>
      <span class="label">{{ themeToggleLabel() }}</span>
    </app-button>

    <app-button
      class="sidebar-logout"
      variant="sidebar"
      type="button"
      [fullWidth]="true"
      (pressed)="onLogout()">
      <span class="icon">
        <!-- Qui metterai il tuo SVG per Logout -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M9 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3H9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="label">Logout</span>
    </app-button>
  </div>

</div>
